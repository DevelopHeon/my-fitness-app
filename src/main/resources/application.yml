spring:
  application:
    name: my-fitness-app
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/my_fitness}
    username: ${DB_USERNAME:my_fitness}
    password: ${DB_PASSWORD:my_fitness}
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: false
    clean-disabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:not-configured}
            client-secret: ${GOOGLE_CLIENT_SECRET:not-configured}
            scope:
              - openid
              - profile
              - email
  session:
    jdbc:
      initialize-schema: never
  ai:
    model:
      chat: ${AI_PROVIDER:none}
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    retry:
      max-attempts: 1
    openai:
      api-key: ${OPENAI_API_KEY:not-configured}
      timeout: ${AI_REQUEST_TIMEOUT:30s}
      max-retries: 0
      chat:
        model: ${AI_OPENAI_MODEL:gpt-4o-mini}
        temperature: ${AI_TEMPERATURE:0.2}
        max-tokens: ${AI_MAX_OUTPUT_TOKENS:500}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: ${AI_OLLAMA_MODEL:qwen3:1.7b}
        temperature: ${AI_TEMPERATURE:0.2}
    chat:
      observations:
        log-prompt: false
        log-completion: false
        include-error-logging: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:30d}
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

app:
  security:
    login-success-url: ${LOGIN_SUCCESS_URL:http://localhost:3000}
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:3000}
  ai:
    prompt-version: ${AI_PROMPT_VERSION:fitness-coach-v1}
    history-message-limit: ${AI_HISTORY_MESSAGE_LIMIT:8}
    history-char-limit: ${AI_HISTORY_CHAR_LIMIT:4000}
    max-message-length: ${AI_MAX_MESSAGE_LENGTH:1000}
    title-max-length: ${AI_TITLE_MAX_LENGTH:60}
    policy:
      model: ${AI_POLICY_MODEL:jev-1.13.0}
      version: ${AI_POLICY_VERSION:fitness-policy-v1}
      api-key: ${TYPESAFE_API_KEY:}
      request-timeout: ${AI_POLICY_TIMEOUT:1500ms}
      review-threshold: ${AI_POLICY_REVIEW_THRESHOLD:0.35}
      action-threshold: ${AI_POLICY_ACTION_THRESHOLD:0.70}
      topic-confidence: ${AI_POLICY_TOPIC_CONFIDENCE:0.60}
