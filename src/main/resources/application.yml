spring:
  application:
    name: my-fitness-app
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/my_fitness}
    username: ${DB_USERNAME:my_fitness}
    password: ${DB_PASSWORD:my_fitness}
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: false
    clean-disabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: ${SERVER_PORT:8080}
