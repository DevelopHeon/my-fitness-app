spring:
  datasource:
    url: jdbc:h2:mem:my_fitness;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  ai:
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    openai:
      api-key: test

app:
  ai:
    prompt-version: fitness-coach-v1
    history-message-limit: 8
    history-char-limit: 4000
    max-message-length: 1000
    title-max-length: 60
