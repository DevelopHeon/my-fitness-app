name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            infra/package-lock.json

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Java source conventions
        run: ./gradlew checkstyleMain checkstyleTest --no-daemon

      - name: Shell syntax
        run: |
          for script in scripts/*.sh; do
            bash -n "$script"
          done

      - name: Deployment contracts
        run: python3 scripts/test-deployment.py

      - name: Local and production monitoring verification
        run: bash scripts/verify-monitoring.sh

      - name: Backend test
        run: ./gradlew test --no-daemon

      - name: Frontend lint
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test

      - name: Application build
        run: ./gradlew build --no-daemon

      - name: CDK verify
        working-directory: infra
        env:
          CDK_DEFAULT_REGION: ap-northeast-2
        run: |
          npm ci
          npm run build
          npm test -- --runInBand
          npx cdk synth --quiet
