name: Deploy App

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: ${{ vars.AWS_DEPLOY_ROLE_ARN != '' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ap-northeast-2
      IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}

    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check image tag in ECR
        id: image
        run: |
          if aws ecr describe-images \
            --repository-name my-fitness \
            --image-ids "imageTag=$IMAGE_TAG" \
            >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "ECR image already exists: my-fitness:$IMAGE_TAG"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "ECR image does not exist yet: my-fitness:$IMAGE_TAG"
          fi

      - name: Set up Java
        if: steps.image.outputs.exists != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node
        if: steps.image.outputs.exists != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Gradle
        if: steps.image.outputs.exists != 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Build application artifact
        if: steps.image.outputs.exists != 'true'
        run: ./gradlew bootJar --no-daemon

      - name: Log in to ECR
        if: steps.image.outputs.exists != 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        if: steps.image.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push ARM64 image
        if: steps.image.outputs.exists != 'true'
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --tag "$REGISTRY/my-fitness:$IMAGE_TAG" \
            --push \
            .

      - name: Deploy image through SSM
        run: |
          INSTANCE_ID="$(aws ssm get-parameter \
            --name /my-fitness/prod/instance-id \
            --query 'Parameter.Value' \
            --output text)"
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]
          RELEASE="/opt/my-fitness/monitoring/releases/$IMAGE_TAG"
          tar -czf /tmp/monitoring-release.tar.gz \
            monitoring scripts/deploy-ec2.sh scripts/setup-caddy.sh \
            scripts/setup-ec2-monitoring.sh scripts/deploy-monitoring.sh scripts/deploy-release.sh
          ARCHIVE_B64="$(base64 < /tmp/monitoring-release.tar.gz | tr -d '\n')"
          if (( ${#ARCHIVE_B64} > 48000 )); then
            echo 'Monitoring release archive exceeds the inline SSM delivery budget' >&2
            exit 1
          fi
          ARCHIVE_SHA="$(sha256sum /tmp/monitoring-release.tar.gz | cut -d ' ' -f 1)"
          jq -n --arg release "$RELEASE" --arg archive "$ARCHIVE_B64" \
            --arg checksum "$ARCHIVE_SHA" --arg tag "$IMAGE_TAG" \
            '{commands: [
              "set -eu",
              ("mkdir -p " + $release),
              ("printf %s " + $archive + " | base64 -d > " + $release + "/release.tar.gz"),
              ("printf \"%s  %s\\n\" " + $checksum + " " + $release + "/release.tar.gz | sha256sum --check --status"),
              ("tar -xzf " + $release + "/release.tar.gz -C " + $release),
              ("bash " + $release + "/scripts/deploy-release.sh " + $tag)
            ], executionTimeout: ["900"]}' > /tmp/deploy-parameters.json

          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters file:///tmp/deploy-parameters.json \
            --query 'Command.CommandId' \
            --output text)"

          STATUS=Pending
          for _ in $(seq 1 180); do
            STATUS="$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || true)"
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 5
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'
          [[ "$STATUS" == Success ]]
