name: my-fitness-monitoring
services:
  secret-init:
    image: prom/prometheus:v3.15.0
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        cp /run/secrets/metrics_password /credentials/metrics_password
        cp /run/secrets/grafana_admin_password /credentials/grafana_admin_password
        chmod 600 /credentials/metrics_password /credentials/grafana_admin_password
        chown 65534:65534 /credentials/metrics_password
        chown 472:0 /credentials/grafana_admin_password
    volumes:
      - monitoring-credentials:/credentials
    secrets:
      - metrics_password
      - grafana_admin_password
  prometheus:
    image: prom/prometheus:v3.15.0
    depends_on:
      secret-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=2GB
    volumes:
      - ./prometheus/prometheus.local.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
      - monitoring-credentials:/credentials:ro
  grafana:
    image: grafana/grafana:13.2.3
    depends_on:
      secret-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /credentials/grafana_admin_password
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning/dashboards/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./grafana/provisioning/datasources/prometheus.local.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
      - monitoring-credentials:/credentials:ro
volumes:
  prometheus-data:
  grafana-data:
  monitoring-credentials:
secrets:
  metrics_password:
    file: ${MONITORING_SECRET_DIR:-../.local/monitoring/secrets}/app.monitoring.password
  grafana_admin_password:
    file: ${MONITORING_SECRET_DIR:-../.local/monitoring/secrets}/grafana_admin_password
