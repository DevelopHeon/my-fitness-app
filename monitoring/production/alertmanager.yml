route:
  receiver: slack
  group_by: [service, environment, alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
receivers:
  - name: slack
    slack_configs:
      - api_url_file: /credentials/slack_webhook_url
        send_resolved: true
        title: '{{ .Status | toUpper }} · {{ .CommonLabels.alertname }} · {{ len .Alerts }}'
        text: |-
          {{ range .Alerts }}{{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}
