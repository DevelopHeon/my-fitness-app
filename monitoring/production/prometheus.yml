global:
  scrape_interval: 60s
  scrape_timeout: 5s
  evaluation_interval: 60s
  external_labels:
    service: my-fitness
    environment: prod
rule_files:
  - /etc/prometheus/alerts.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['127.0.0.1:9093']
scrape_configs:
  - job_name: my-fitness
    metrics_path: /actuator/prometheus
    basic_auth:
      username: prometheus
      password_file: /credentials/metrics_password
    static_configs:
      - targets: ['127.0.0.1:8080']
  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9090']
  - job_name: node
    static_configs:
      - targets: ['127.0.0.1:9100']
