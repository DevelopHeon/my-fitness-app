        },
        {
          "series": "app_ai_provider_seconds_count{job=\"my-fitness\",kind=\"chat\",outcome=\"SUCCESS\"}",
          "values": "0+0.1x30"
        }
      ],
      "alert_rule_test": [
        {
          "eval_time": "20m",
          "alertname": "AppMetricsUnavailable",
