        {
          "eval_time": "20m",
          "alertname": "PolicyUnavailable",
          "exp_alerts": []
        },
        {
          "eval_time": "20m",
          "alertname": "AiProviderFailures",
          "exp_alerts": []
        },
        {
          "eval_time": "20m",
          "alertname": "JvmHeapPressure",
          "exp_alerts": []
        },
        {
          "eval_time": "20m",
