global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: my-fitness
    metrics_path: /actuator/prometheus
    basic_auth:
      username: prometheus
      password_file: /credentials/metrics_password
    static_configs:
      - targets: [host.docker.internal:8080]
