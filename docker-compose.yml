services:
  postgres:
    image: postgres:17-alpine
    container_name: my-fitness-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-my_fitness}
      POSTGRES_USER: ${POSTGRES_USER:-my_fitness}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-my_fitness}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - my-fitness-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-my_fitness} -d ${POSTGRES_DB:-my_fitness}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  my-fitness-postgres-data:
